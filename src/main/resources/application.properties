spring.application.name=SprintForge
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sprintforge}
spring.datasource.username=${DATABASE_USERNAME:sprintforge}
spring.datasource.password=${DATABASE_PASSWORD:sprintforge}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=PT5M
spring.cache.redis.cache-null-values=false
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
springdoc.swagger-ui.path=/docs
app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-key-32chars}
app.jwt.ttl=PT8H
app.jwt.refresh-ttl=${REFRESH_TOKEN_TTL:P30D}
app.metrics.key=${METRICS_KEY:local-prometheus-key}
app.notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.notifications.email.from=${MAIL_FROM:noreply@sprintforge.dev}
app.storage.s3.enabled=${S3_ENABLED:false}
app.storage.s3.bucket=${S3_BUCKET:sprintforge-attachments}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.upload-ttl=PT10M
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

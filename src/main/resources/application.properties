spring.application.name=SprintForge
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sprintforge}
spring.datasource.username=${DATABASE_USERNAME:sprintforge}
spring.datasource.password=${DATABASE_PASSWORD:sprintforge}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/docs
app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-key-32chars}
app.jwt.ttl=PT8H

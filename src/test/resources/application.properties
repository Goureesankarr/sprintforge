spring.datasource.url=jdbc:h2:mem:sprintforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256
app.jwt.ttl=PT1H
app.jwt.refresh-ttl=P7D
app.metrics.key=test-metrics-key
spring.cache.type=simple
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.prometheus.metrics.export.enabled=true
